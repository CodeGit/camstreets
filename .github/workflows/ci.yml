name: CI

# Runs the Playwright e2e suite against a fresh local Supabase stack on
# every push to dev/main. Unrelated to reset-demo.yml, which manages real
# data on the hosted dev project rather than testing anything.

on:
  push:
    branches: [dev, main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The local Supabase stack's fixed demo keys - not secrets, the same
      # values `supabase start` prints for every project and never valid
      # against a hosted one (see .env.local's own comment to this effect).
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
      SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
      # Needed for e2e/become-admin.spec.ts: BecomeAdminButton renders
      # nothing at all unless this is set (see its own comment in
      # src/components/dashboards/becomeAdminButton.tsx) - only ever true
      # here and in local .env.local, never in a real deployment's env.
      ALLOW_SELF_ELEVATE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Docker is preinstalled and running on ubuntu-latest runners, so
      # this just works - no separate Supabase CLI setup action needed
      # since it's already a devDependency (see package.json).
      - name: Start local Supabase stack (migrations + seed run automatically)
        run: pnpm run db:start
      - name: Install Playwright's browser (chromium only - the only configured project)
        run: pnpm exec playwright install --with-deps chromium
      - name: Run e2e tests
        run: pnpm exec playwright test
      - name: Upload Playwright HTML report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
